# Bagimliliklari otomatik guncel tutar; guncellemeler PR olarak acilir
# ve her PR guvenlik pipeline'indan gecmek zorundadir.
version: 2
updates:
  # Python bagimliliklari - kok dizinden tarama app/requirements.txt ve
  # requirements-dev.txt dosyalarinin ikisini de kapsar
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions surumleri
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base image (docker/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
