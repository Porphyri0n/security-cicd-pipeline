rules:
  - id: custom-hardcoded-aws-key
    pattern-either:
      - pattern: AWS_ACCESS_KEY_ID = "..."
      - pattern: AWS_SECRET_ACCESS_KEY = "..."
    message: >
      Hard-coded AWS erisim anahtari tespit edildi.
      Credential'lar ortam degiskenlerinde saklanmalidir.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      remediation: os.environ.get("AWS_ACCESS_KEY_ID") kullanin

  - id: custom-hardcoded-password
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i).*(password|secret|key|token).*"
    message: >
      Olasi hard-coded credential tespit edildi: $VAR
      Hassas degerleri ortam degiskenlerinden okuyun.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
